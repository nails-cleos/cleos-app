<div class="grid-container">
  <h1 class="mat-h1">Overview</h1>
  <mat-grid-list [cols]="(layout | async)?.columns" rowHeight="200px">
    <mat-grid-tile [colspan]="(layout | async)?.miniCard?.cols" [rowspan]="(layout | async)?.miniCard?.rows">
      <mat-card class="dashboard-card">
        <mat-card-content class="dashboard-card-content">
          <div *ngIf="user; else circle" class="center-circle circle profile-background">
            <img *ngIf="image; else showInitialsBlock" [src]="image" alt="Profile" mat-card-image>
            <ng-template #showInitialsBlock>
              <div class="initials">{{ initials | uppercase }}</div>
            </ng-template>
          </div>
          <ng-template #circle>
            <div class="center-circle ssc-circle w-100"></div>
          </ng-template>
        </mat-card-content>
      </mat-card>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="(layout | async)?.miniCard?.cols" [rowspan]="(layout | async)?.miniCard?.rows">
      <mat-card class="dashboard-card">
        <mat-card-header *ngIf="user; else skeletonTitle" class="card-header">
          <mat-card-title>{{username}}</mat-card-title>
        </mat-card-header>
        <ng-template #skeletonTitle>
          <div class="ssc-head-line"></div>
        </ng-template>
        <mat-card-content>
          <div class="text-center">
            <span *ngIf="user; else skeleton">
              <mat-icon color="primary" matSuffix>cake</mat-icon>
              {{user.dob ? user.dob : 'N/A'}}
            </span>
          </div>
          <div class="text-center">
            <span *ngIf="user; else skeleton">
              <mat-icon color="primary" matSuffix>phone</mat-icon>
              {{user.phone ? user.phone : 'N/A'}}
            </span>
          </div>
        </mat-card-content>
        <ng-template #skeleton>
          <div class="divider ssc-line"></div>
        </ng-template>
      </mat-card>
    </mat-grid-tile>
    <mat-grid-tile *ngFor="let mc of miniCardData; let i = index" [colspan]="( layout | async )?.miniCard?.cols"
                   [rowspan]="( layout | async )?.miniCard?.rows">
      <mat-card class="dashboard-card">
        <div *ngIf="mc.title; else box">
          <mat-card-header class="card-header">
            <mat-card-title>{{mc.title | translate}}</mat-card-title>
          </mat-card-header>
          <mat-card-content *ngIf="!mc.error; else error">
            <div class="card-icon" mat-card-avatar>
              <mat-icon class="avatar-icon" color="primary">{{mc.icon}}</mat-icon>
            </div>
            <div *ngIf="mc.split; else noSplit" class="text-center">
              <div *ngIf="mc.link; else noLink">
                <h3 (click)="mc.link(mc.primary)" class="pointer">{{mc.primaryValue}}</h3>
                <h3 (click)="mc.link(mc.secondary)" class="pointer">{{mc.secondaryValue}}</h3>
              </div>
              <ng-template #noLink>
                <h3>{{mc.primaryValue}}</h3>
                <h3>{{mc.secondaryValue}}</h3>
              </ng-template>
            </div>
            <ng-template #noSplit>
              <h1 class="value-text">{{mc.primaryValue}}/{{mc.secondaryValue}}</h1>
            </ng-template>
          </mat-card-content>
          <ng-template #error>
            <app-error [error]="mc.error" [isCard]="true" class="value-text"></app-error>
          </ng-template>
        </div>
        <ng-template #box>
          <div class="ssc-square mb"></div>
        </ng-template>
      </mat-card>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="( layout | async )?.chart?.cols" [rowspan]="( layout | async )?.chart?.rows">
      <app-card [chart]="productChart" [title]="'DASHBOARD.CARD.QUANTITY_PRODUCT' | translate">
        <app-overview-chart [chartSummary]="productChart" [error]="productError"></app-overview-chart>
      </app-card>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="( layout | async )?.chart?.cols" [rowspan]="( layout | async )?.chart?.rows">
      <app-card [chart]="paymentChart" [title]="'DASHBOARD.CARD.PAYMENT' | translate">
        <app-overview-chart [chartSummary]="paymentChart" [error]="paymentError"></app-overview-chart>
      </app-card>
    </mat-grid-tile>
  </mat-grid-list>
</div>
<div class="grid-container">
  <div fxFlex></div>
  <button appBackButton color="accent" mat-raised-button type="button">{{ 'COMMON.BUTTON.BACK' | translate }}</button>
</div>
