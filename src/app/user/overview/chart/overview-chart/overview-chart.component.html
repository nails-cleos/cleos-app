<div *ngIf="chartSummary || error; else box" class="chartContainer">
  <div *ngIf="chart && chart.data && !error; else errorBox">
    <canvas [chartType]="chart.type"
            [colors]="chart.colors"
            [data]="chart.data"
            [labels]="chart.labels"
            [legend]="true"
            [options]="chart.options"
            baseChart>
    </canvas>
  </div>
  <ng-template #errorBox>
    <app-error [error]="error" [isCard]="true"></app-error>
  </ng-template>
</div>
<ng-template #box>
  <div class="ssc-square"></div>
  <div class="ssc-square"></div>
</ng-template>
