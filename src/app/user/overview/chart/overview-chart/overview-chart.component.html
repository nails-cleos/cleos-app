@let currentError = error();
@let chart = chartSignal();
@if (chart || currentError) {
  <div class="chartContainer">
    @if (chart && chart.charData && !currentError) {
      <div>
        <canvas
          [type]="chart.type"
          [datasets]="chart.charData.datasets"
          [labels]="chart.labels"
          [legend]="true"
          [options]="chart.options"
          baseChart
        >
        </canvas>
      </div>
    } @else {
      <app-error [error]="currentError" [isCard]="true"></app-error>
    }
  </div>
} @else {
  <div class="ssc-square"></div>
  <div class="ssc-square"></div>
}
