<div *ngIf="chartSummary || error; else box" class="chartContainer">
  <div *ngIf="chart && chart.charData && !error; else errorBox">
    <canvas [type]="chart.type"
            [datasets]="chart.charData.datasets"
            [labels]="chart.labels"
            [legend]="true"
            [options]="chart.options"
            baseChart>
    </canvas>
  </div>
  <ng-template #errorBox>
    <app-error [error]="error" [isCard]="true"></app-error>
  </ng-template>
</div>
<ng-template #box>
  <div class="ssc-square"></div>
  <div class="ssc-square"></div>
</ng-template>
