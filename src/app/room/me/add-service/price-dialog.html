<form (ngSubmit)="submit" [formGroup]="form" novalidate (keydown.enter)="$event.preventDefault()">
  <h1 mat-dialog-title>{{ 'ROOM.ME.SERVICES.ADD' | translate }}</h1>
  <div mat-dialog-content>
    <p>{{ 'ROOM.ME.SERVICES.PRICE.TEXT' | translate: { name: data.name } }}</p>
    <mat-form-field appearance="outline">
      <mat-label>{{ 'ROOM.ME.SERVICES.PRICE.FIELD' | translate }}</mat-label>
      <input [formControl]="price" matInput min="1" required type="number">
      @if (price.hasError('required')) {
        <mat-error [innerHTML]="'ROOM.ME.SERVICES.PRICE.REQUIRED' | translate"></mat-error>
      } @else if (price.hasError('min')) {
        <mat-error>{{ 'ROOM.ME.SERVICES.PRICE.GREATER' | translate }}</mat-error>
      }
    </mat-form-field>
  </div>
  <div mat-dialog-actions>
    <button (click)="onNoClick" color="accent" mat-fab extended class="icon-button" type="button">
      {{ 'COMMON.BUTTON.CANCEL' | translate }}
    </button>
    <button cdkFocusInitial color="primary" mat-fab extended class="icon-button" type="submit">Ok</button>
  </div>
</form>
