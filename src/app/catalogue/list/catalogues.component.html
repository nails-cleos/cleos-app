<div *ngIf="catalogues.length; else errorBox">
  <mat-card>
    <mat-card-content>
      <mat-grid-list [cols]="(isHandset$ | async) ? 1 : 3" rowHeight="2:1">
        <mat-grid-tile *ngFor="let catalogue of catalogues; let i = index;">
          <cdk-drop-list [cdkDropListConnectedTo]="drops" [cdkDropListData]="i">
            <mat-card (cdkDragEntered)="entered($event)" [cdkDragData]="i" cdkDrag
                      class="catalogue-card mat-elevation-z8">
              <mat-icon *ngIf="catalogue.home && !catalogue.catalog" color="primary">home</mat-icon>
              <mat-icon *ngIf="!catalogue.home && catalogue.catalog" color="primary">collections</mat-icon>
              <img *ngIf="catalogue.id; else box" [alt]="catalogue.name" [matTooltip]="catalogue.name"
                   [src]="'data:image/jpg;base64,'+catalogue.blob"
                   mat-card-sm-image
                   matTooltipPosition="above"/>
              <ng-template #box>
                <div class="ssc-square mb"></div>
              </ng-template>
              <div *ngIf="catalogue.id" class="wrapper" fxFlex>
                <mat-icon (click)="edit(catalogue)" class="edit" matTooltip="{{ 'COMMON.BUTTON.EDIT' | translate }}"
                          matTooltipPosition="left">edit
                </mat-icon>
                <mat-icon (click)="delete(catalogue)" class="delete" color="warn"
                          matTooltip="{{ 'COMMON.BUTTON.DELETE' | translate }}"
                          matTooltipPosition="left">delete
                </mat-icon>
              </div>
            </mat-card>
          </cdk-drop-list>
        </mat-grid-tile>
      </mat-grid-list>
    </mat-card-content>
    <mat-card-actions>
      <button (click)="finish()" color="primary"
              mat-raised-button>{{ 'COMMON.BUTTON.UPDATE' | translate }}</button>
    </mat-card-actions>
  </mat-card>

  <button color="accent" id="add-button" mat-fab matTooltip="{{ 'CATALOGUE.ADD.TITLE' | translate }}"
          routerLink="/catalogues/add">
    <mat-icon>add_a_photo</mat-icon>
  </button>
</div>

<ng-template #errorBox>
  <button class="only-button" color="accent" mat-raised-button routerLink="/catalogues/add">
    <mat-icon>add_a_photo</mat-icon> &nbsp;{{ 'CATALOGUE.ADD.TITLE' | translate }}
  </button>
</ng-template>
