<div class="flex-container" fxLayout="column">
  <div class="card-container" fxLayout="row" fxLayout.xs="column" fxLayoutAlign="center">
    <div fxFlex="50%" fxFlex.gt-lg="40%" fxFlex.lt-sm="80%">
      <mat-card appearance="outlined">
        <mat-card-header fxLayout="row" fxLayoutAlign="center">
          <mat-card-title>{{ 'ME.REFERRAL.TITLE' | translate }}</mat-card-title>
        </mat-card-header>
        <mat-divider></mat-divider>
        <mat-card-content>
          <div class="message divider" fxLayout="row" fxLayoutAlign="center">
            {{'ME.REFERRAL.MESSAGE' | translate}}
          </div>
          <div class="divider" fxLayout="row" fxLayoutAlign="center">
            {{'ME.REFERRAL.DETAIL' | translate}}
          </div>
          <div *ngIf="user" class="divider" fxLayout="row" fxLayoutAlign="center">
            <div class="box">
              <div class="vertical-center">
                <div class="box-text bold">
                  {{user.id}}
                </div>
                <mat-chip-listbox class="box-button">
                  <mat-chip-option (click)="copy" [disabled]="!showShare">{{'COMMON.BUTTON.COPY' | translate }}</mat-chip-option>
                </mat-chip-listbox>
              </div>
            </div>
          </div>
        </mat-card-content>
        <mat-card-actions>
          <div fxFlex></div>
          <button (click)="openBottomSheetShare" [disabled]="!showShare" color="primary"
                  mat-fab extended class="icon-button">{{'COMMON.BUTTON.SHARE' | translate }}</button>
          <button (click)="openBottomSheetReferral" [disabled]="!showInvites" mat-fab extended class="icon-button">
            {{'ME.REFERRAL.INVITE.TITLE' | translate }}
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>
