<div class="app-surface-canvas app-surface-shell app-surface-stack">
  <section class="app-surface-section">
    <div class="app-detail-section-header">
      <div>
        <span class="app-surface-eyebrow">{{ 'ME.REFERRAL.TITLE' | translate }}</span>
      </div>
    </div>

    <div class="referrals-copy">
      {{ 'ME.REFERRAL.MESSAGE' | translate }}
    </div>

    <p class="referrals-detail">{{ 'ME.REFERRAL.DETAIL' | translate }}</p>

    @let currentUserId = userId();
    @if (currentUserId) {
      <div class="app-surface-item referrals-code-card">
        <div>
          <span class="app-surface-item__label">{{ 'ME.REFERRAL.TITLE' | translate }}</span>
          <strong class="referrals-code">{{ currentUserId }}</strong>
        </div>

        <button (click)="copy()" [disabled]="!showShare()" mat-stroked-button type="button">
          <mat-icon>content_copy</mat-icon>
          <span>{{ 'COMMON.BUTTON.COPY' | translate }}</span>
        </button>
      </div>
    }

    <div class="app-detail-actions">
      <button (click)="openBottomSheetShare()" [disabled]="!showShare()" mat-stroked-button type="button">
        <mat-icon>share</mat-icon>
        <span>{{ 'COMMON.BUTTON.SHARE' | translate }}</span>
      </button>
      <button (click)="openBottomSheetReferral()" [disabled]="!showInvites()" mat-stroked-button type="button">
        <mat-icon>group_add</mat-icon>
        <span>{{ 'ME.REFERRAL.INVITE.TITLE' | translate }}</span>
      </button>
    </div>
  </section>
</div>
