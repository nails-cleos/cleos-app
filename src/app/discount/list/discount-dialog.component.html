<button (click)="onNoClick" class="close-button" mat-icon-button>
  <mat-icon>close</mat-icon>
</button>
<h1 mat-dialog-title>{{ title }}</h1>
@if (allCustomers) {
  <div mat-dialog-content>
    <mat-form-field class="chip-list">
      <mat-label>{{ 'DISCOUNT.LIST.DIALOG.CUSTOMER' | translate }}</mat-label>
      <mat-chip-grid #chipList aria-label="Customer selection">
        @for (customer of customers; track customer) {
          <mat-chip-row (removed)="remove(customer)" [removable]="true">
            {{ customer.displayName }}
            <mat-icon matChipRemove>cancel</mat-icon>
          </mat-chip-row>
        }
        <input #customerInput [formControl]="customerCtrl" [matAutocomplete]="auto" [matChipInputFor]="chipList">
      </mat-chip-grid>
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)">
        @for (customer of sortCustomers(filteredCustomers | async); track customer) {
          <mat-option [value]="customer">{{ customer.displayName }}</mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>
  </div>
}
<div mat-dialog-actions class="card-actions">
  <div class="spacer"></div>
  <button (click)="doAction" cdkFocusInitial color="primary"
          mat-fab extended class="icon-button">{{ 'COMMON.BUTTON.DISCOUNT.SEND' | translate }}
  </button>
  <button (click)="onNoClick" mat-fab extended class="icon-button">{{ 'COMMON.BUTTON.CANCEL' | translate }}</button>
</div>
