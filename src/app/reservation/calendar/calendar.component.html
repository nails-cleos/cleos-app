<div *ngIf="data && data.length && calendar && calendar.size; else errorBox" class="scroll-container">
  <div class="divider">
    <button (click)="decrement()" [disabled]="prevBtnDisabled"
            color="accent" mat-raised-button>
      <mat-icon>navigate_before</mat-icon>
      <span fxHide.lt-sm fxShow>{{'COMMON.BUTTON.PREVIOUS' | translate}}</span>
    </button>
    <input (dateChange)="selectDate($event)" [matDatepicker]="picker" [max]="maxDate" [min]="today" hidden matInput>
    <mat-datepicker #picker touchUi></mat-datepicker>
    <button (click)="picker.open()" color="primary" mat-raised-button>
      <mat-icon>today</mat-icon>
      <span fxHide.lt-sm fxShow>{{'COMMON.BUTTON.GOTO' | translate}}</span>
    </button>
    <button (click)="increment()" [disabled]="nextBtnDisabled" color="accent" mat-raised-button>
      <span fxHide.lt-sm fxShow>{{'COMMON.BUTTON.NEXT' | translate}}</span>
      <mat-icon>navigate_next</mat-icon>
    </button>
    <div fxFlex></div>
    <button color="accent" mat-raised-button routerLink="/reservation">
      <mat-icon>book_online</mat-icon>
      <span fxHide.lt-sm fxShow>{{ 'COMMON.BUTTON.BOOK' | translate }}</span>
    </button>
  </div>
  <div class="divider">
    <mat-accordion>
      <mat-expansion-panel *ngFor="let rr of data; let i = index"
                           [expanded]="professionalId === rr.room.professional.id || i === 0">
        <mat-expansion-panel-header>
          <mat-panel-title>
            <p class="bold">{{rr.room.name}}</p>
          </mat-panel-title>
        </mat-expansion-panel-header>
        <div [ngSwitch]="selectView">
          <div *ngSwitchCase="'week'">
            <mwl-calendar-week-view
              (eventClicked)="view($event.event)"
              (hourSegmentClicked)="segmentClick($event.date, rr.room)"
              [dayEndHour]="calendar.get(rr.room.id)!.day!.dayEndHour"
              [dayEndMinute]="calendar.get(rr.room.id)!.day!.dayEndMinute"
              [dayStartHour]="calendar.get(rr.room.id)!.day!.dayStartHour"
              [dayStartMinute]="calendar.get(rr.room.id)!.day!.dayStartMinute"
              [daysInWeek]="daysInWeek"
              [events]="calendar.get(rr.room.id)!.events"
              [hourSegments]="hourSegments"
              [locale]="locale"
              (beforeViewRender)="beforeMonthViewRender($event)"
              [viewDate]="viewDate"></mwl-calendar-week-view>
          </div>
          <div *ngSwitchCase="'day'">
            <h3>{{ viewDate | calendarDate:(calendarView + 'ViewTitle'):locale }}</h3>
            <mwl-calendar-day-view
              (eventClicked)="view($event.event)"
              (hourSegmentClicked)="segmentClick($event.date, rr.room)"
              [dayEndHour]="calendar.get(rr.room.id)!.day!.dayEndHour"
              [dayEndMinute]="calendar.get(rr.room.id)!.day!.dayEndMinute"
              [dayStartHour]="calendar.get(rr.room.id)!.day!.dayStartHour"
              [dayStartMinute]="calendar.get(rr.room.id)!.day!.dayStartMinute"
              [events]="calendar.get(rr.room.id)!.events"
              [hourSegments]="hourSegments"
              [locale]="locale"
              [viewDate]="viewDate"></mwl-calendar-day-view>
          </div>
        </div>
      </mat-expansion-panel>
    </mat-accordion>
  </div>
</div>
<ng-template #errorBox>
  <button class="only-button" color="accent" mat-raised-button routerLink="/rooms/add">
    <mat-icon>add_business</mat-icon> &nbsp;{{ 'ROOM.ADD.TITLE' | translate }}
  </button>
</ng-template>
