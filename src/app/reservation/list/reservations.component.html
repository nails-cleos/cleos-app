<div *ngIf="!isLoading; else box">
  <div class="divider">
    <button (viewDateChange)="previousWeek()" [(viewDate)]="viewDate" [view]="calendarView" [disabled]="!week"
            color="accent" mat-raised-button mwlCalendarPreviousView>
      Previous
    </button>
    <button [(viewDate)]="viewDate" color="primary" (viewDateChange)="today()"
            mat-raised-button mwlCalendarToday>
      Today
    </button>
    <button (viewDateChange)="nextWeek()" [(viewDate)]="viewDate" [view]="calendarView" color="accent"
            mat-raised-button mwlCalendarNextView [disabled]="week > 6">
      Next
    </button>
    <div fxFlex></div>
    <button color="accent" mat-raised-button routerLink="/reservation">
      <mat-icon>add</mat-icon>
      {{ 'COMMON.BUTTON.ADD' | translate }}
    </button>
  </div>
  <div class="divider">
    <mat-accordion>
      <mat-expansion-panel *ngFor="let rr of data; let i = index" [expanded]="i === 0">
        <mat-expansion-panel-header>
          <mat-panel-title>
            <p style="font-weight: bold">{{rr.room.name}}</p>
          </mat-panel-title>
        </mat-expansion-panel-header>
        <mwl-calendar-week-view
          (eventClicked)="view($event.event)"
          (hourSegmentClicked)="segmentClick($event.date, rr.room)"
          [dayEndHour]="calendar.get(rr.room.id)!.day!.dayEndHour"
          [dayEndMinute]="calendar.get(rr.room.id)!.day!.dayEndMinute"
          [dayStartHour]="calendar.get(rr.room.id)!.day!.dayStartHour"
          [dayStartMinute]="calendar.get(rr.room.id)!.day!.dayStartMinute"
          [daysInWeek]="calendar.get(rr.room.id)!.day!.daysInWeek"
          [events]="calendar.get(rr.room.id)!.events"
          [hourSegments]="calendar.get(rr.room.id)!.day!.hourSegments"
          [viewDate]="viewDate"></mwl-calendar-week-view>
      </mat-expansion-panel>
    </mat-accordion>
  </div>
</div>
<ng-template #box>
  <div class="ssc-square mb"></div>
</ng-template>
