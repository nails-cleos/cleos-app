<div class="content">
  <section class="section-style">
    <div class="frame flex-wrap">
      @for (catalogue of catalogues(); track catalogue) {
        <mat-card appearance="outlined" class="catalogue-card flex-item">
          @if (catalogue.treatmentGroup) {
            <mat-card-header>
              <mat-card-title>{{ catalogue.name }}</mat-card-title>
              <mat-card-subtitle>{{ catalogue.treatmentGroup.name }}</mat-card-subtitle>
            </mat-card-header>
          } @else {
            <mat-card-header>
              <mat-card-title>{{ catalogue.name }}</mat-card-title>
              <mat-card-subtitle>{{ 'MAIN.CATALOGUE.NO_DETAIL' | translate }}</mat-card-subtitle>
            </mat-card-header>
          }
          <mat-card-content class="text-center">
            <img mat-card-md-image [alt]="catalogue.name" [src]="catalogue.image"/>
          </mat-card-content>
          <mat-card-actions class="card-actions">
            <div class="spacer"></div>
            <a [href]="catalogue.image" rel="noreferrer" target="_blank">
              <mat-icon>zoom_out_map</mat-icon>
            </a>
          </mat-card-actions>
        </mat-card>
      }
    </div>
  </section>
</div>
