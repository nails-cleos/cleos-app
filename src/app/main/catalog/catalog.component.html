<div class="content">
  <section class="section-style">
    <div style="margin-top: 20px; margin-bottom: 20px">
      <app-image-viewer (eventEmitter)="viewerOpen = false" [imageURL]="imageURL"
                        [open]="viewerOpen"></app-image-viewer>
      <mat-grid-list [cols]="(isHandset$ | async) ? 1 : 3" fxLayoutAlign="center center" rowHeight="2:1">
        <mat-grid-tile *ngFor="let catalogue of catalogues; let i = index;">
          <mat-icon (click)="openImage(catalogue)" class="expand">open_in_full</mat-icon>
          <mat-card class="catalogue-card mat-elevation-z8">
            <img *ngIf="catalogue.id; else box" [alt]="catalogue.name"
                 [src]="'data:image/jpg;base64,'+ catalogue.blob" mat-card-sm-image/>
            <ng-template #box>
              <div class="ssc-square mbs"></div>
            </ng-template>
          </mat-card>
        </mat-grid-tile>
      </mat-grid-list>
    </div>
  </section>
</div>
