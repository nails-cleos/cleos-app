<div class="flex-container" fxLayout="column">
  <div class="card-container" fxLayout="row" fxLayout.xs="column" fxLayoutAlign="center">
    <div fxFlex="50%" fxFlex.gt-lg="40%" fxFlex.lt-sm="80%">
      <form (ngSubmit)="create()" [formGroup]="form" novalidate>
        <mat-card class="style-card">
          <mat-card-header>
            <mat-card-title>{{ 'CURRENCY.TITLE' | translate }}</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <div fxLayout="column" fxLayoutAlign="space-evenly stretch">
              <mat-form-field appearance="fill">
                <mat-label>{{ 'CURRENCY.CODE.FIELD' | translate }}</mat-label>
                <label>
                  <input [formControl]="code" matInput required>
                </label>
                <mat-error *ngIf="code.hasError('required')" [innerHTML]="'CURRENCY.CODE.REQUIRED' | translate">
                </mat-error>
                <mat-error *ngIf="errors['code']">
                  {{errors['code']}}
                </mat-error>
              </mat-form-field>
              <mat-form-field appearance="fill">
                <mat-label>{{ 'CURRENCY.NAME.FIELD' | translate }}</mat-label>
                <label>
                  <input [formControl]="name" matInput>
                </label>
                <mat-error *ngIf="errors['name']">
                  {{errors['name']}}
                </mat-error>
              </mat-form-field>
              <mat-form-field appearance="fill">
                <mat-label>{{ 'CURRENCY.ICON.FIELD' | translate }}</mat-label>
                <mat-select [formControl]="icon">
                  <mat-select-trigger>
                    <mat-icon>{{icon.value}}</mat-icon>
                  </mat-select-trigger>
                  <mat-option>--</mat-option>
                  <mat-option *ngFor="let ic of icons" [value]="ic">
                    <mat-icon>{{ic}}</mat-icon>
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </mat-card-content>
          <mat-card-actions>
            <div fxFlex></div>
            <button [disabled]="form.invalid" color="primary" mat-raised-button
                    type="submit">{{ 'COMMON.BUTTON.CREATE' | translate }}</button>
            <button [form]="form" appBackButton color="accent" mat-raised-button
                    type="button">{{ 'COMMON.BUTTON.BACK' | translate }}</button>
          </mat-card-actions>
        </mat-card>
      </form>
    </div>
  </div>
</div>
