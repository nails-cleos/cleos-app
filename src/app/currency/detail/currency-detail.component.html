<div class="flex-container" fxLayout="column">
  <div class="card-container" fxLayout="row" fxLayout.xs="column" fxLayoutAlign="center">
    <div fxFlex="50%" fxFlex.gt-lg="40%" fxFlex.lt-sm="80%">
      <mat-card appearance="outlined">
        <mat-card-header>
          <mat-card-title>{{ 'CURRENCY.DETAIL' | translate }}</mat-card-title>
          <mat-card-subtitle *ngIf="currency; else skeleton">{{currency.code}}</mat-card-subtitle>
          <ng-template #skeleton>
            <div class="ssc-line"></div>
          </ng-template>
        </mat-card-header>
        <form (ngSubmit)="update" [formGroup]="form" novalidate>
          <mat-card-content *ngIf="currency; else boxSkeleton">
            <div fxLayout="column" fxLayoutAlign="space-evenly stretch">
              <mat-form-field appearance="outline">
                <mat-label>{{ 'CURRENCY.CODE.FIELD' | translate }}</mat-label>
                <label>
                  <input [formControl]="code" matInput required>
                </label>
                <mat-error *ngIf="code.hasError('required')" [innerHTML]="'CURRENCY.CODE.REQUIRED' | translate">
                </mat-error>
                <mat-error *ngIf="errors['code']">
                  {{errors['code']}}
                </mat-error>
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>{{ 'CURRENCY.NAME.FIELD' | translate }}</mat-label>
                <label>
                  <input [formControl]="name" matInput>
                </label>
                <mat-error *ngIf="errors['name']">
                  {{errors['name']}}
                </mat-error>
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>{{ 'CURRENCY.ICON.FIELD' | translate }}</mat-label>
                <mat-select [formControl]="icon">
                  <mat-select-trigger>
                    <mat-icon>{{icon.value}}</mat-icon>
                  </mat-select-trigger>
                  <mat-option>--</mat-option>
                  <mat-option *ngFor="let ic of icons" [value]="ic">
                    <mat-icon>{{ic}}</mat-icon>
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </mat-card-content>
          <ng-template #boxSkeleton>
            <div class="ssc-hr"></div>
            <div class="ssc-square mb"></div>
            <div class="ssc-hr"></div>
          </ng-template>
          <mat-card-actions *ngIf="currency; else buttonSkeleton">
            <div fxFlex></div>
            <button [form]="form" appBackButton color="accent" mat-fab extended class="icon-button"
                    type="button">{{ 'COMMON.BUTTON.BACK' | translate }}</button>
            <button [disabled]="form.invalid || form.pristine" color="primary" mat-fab extended class="icon-button"
                    type="submit">{{ 'COMMON.BUTTON.UPDATE' | translate }}</button>
          </mat-card-actions>
          <ng-template #buttonSkeleton>
            <div class="ssc-head-line"></div>
          </ng-template>
        </form>
      </mat-card>
    </div>
  </div>
</div>
