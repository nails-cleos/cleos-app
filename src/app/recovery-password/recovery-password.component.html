<div class="flex-container" fxLayout="column">
  <div fxLayout="row" fxLayout.xs="column" fxLayoutAlign="center" class="card-container">
    <div fxFlex.lt-sm="80%" fxFlex="50%" fxFlex.gt-lg="40%">
      <form (ngSubmit)="recoveryPassword()" [formGroup]="form" novalidate>
        <mat-card>
          <mat-card-title>{{ 'AUTH.RECOVERY_PASSWORD.TITLE' | translate }}</mat-card-title>
          <mat-card-content>
            <div fxLayout="column" fxLayoutAlign="space-evenly stretch">
              <mat-form-field>
                <mat-label>{{ 'AUTH.RECOVERY_PASSWORD.PASSWORD.FIELD' | translate }}</mat-label>
                <input matInput required [type]="hide ? 'password' : 'text'" autocomplete="current-password"
                       formControlName="password">
                <button type="button" mat-icon-button matSuffix (click)="hide = !hide">
                  <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
                <mat-error [innerHTML]="'AUTH.RECOVERY_PASSWORD.PASSWORD.REQUIRED' | translate">
                </mat-error>
              </mat-form-field>
              <mat-form-field>
                <mat-label>{{ 'AUTH.RECOVERY_PASSWORD.CONFIRM_PASSWORD.FIELD' | translate }}</mat-label>
                <input matInput required [type]="hideConfirm ? 'password' : 'text'" autocomplete="current-password"
                       formControlName="confirmPassword">
                <button type="button" mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm">
                  <mat-icon>{{hideConfirm ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
                <mat-error *ngIf="confirmPassword.hasError('required')"
                           [innerHTML]="'AUTH.RECOVERY_PASSWORD.CONFIRM_PASSWORD.REQUIRED' | translate">
                </mat-error>
                <mat-error *ngIf="confirmPassword.hasError('mustMatch')">
                  {{ 'AUTH.RECOVERY_PASSWORD.CONFIRM_PASSWORD.MUST_MATCH' | translate }}
                </mat-error>
              </mat-form-field>
            </div>
          </mat-card-content>
          <mat-card-actions>
            <div fxFlex></div>
            <button fxFlex mat-raised-button color="primary" [disabled]="form.invalid"
                    type="submit">{{ 'COMMON.BUTTON.SEND' | translate }}</button>
            <button mat-raised-button color="accent"
                    routerLink="/dashboard/auth">{{ 'COMMON.BUTTON.BACK' | translate }}</button>
          </mat-card-actions>
        </mat-card>
      </form>
    </div>
  </div>
</div>
