<div class="app-crud-form">
  <div (click)="goToQuarter()" class="app-detail-section-header quarter-header pointer">
    <div>
      <span class="app-surface-eyebrow">Q{{ quarter() }}</span>
    </div>
  </div>

  <div class="quarter-grid">
  @for (month of monthSummaries(); track month) {
    <div class="app-surface-section quarter-content">
      <div (click)="goToMonth(month.month)" class="app-detail-section-header quarter-month-header pointer">
        <div>
            <span class="app-surface-eyebrow">{{ getMonth(month.month) }}</span>
          </div>
        </div>
        <div class="quarter-month-body">
          <app-month [month]="month" [year]="year()" [currency]="currency()" [showCash]="showCash()"></app-month>
        </div>
      </div>
    }
  </div>
</div>
