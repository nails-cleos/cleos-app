<div *ngIf="state; else box" class="chartContainer">
  <div *ngIf="!error; else errorBox">
    <canvas [chartType]="barChartType"
            [colors]="barChartColors"
            [datasets]="barChartData"
            [labels]="barChartLabels"
            [legend]="barChartLegend"
            [options]="barChartOptions"
            [plugins]="barChartPlugins"
            baseChart>
    </canvas>
  </div>
  <ng-template #errorBox>
    <app-error [error]="error" [isCard]="true"></app-error>
  </ng-template>
</div>
<ng-template #box>
  <div class="ssc-square mb"></div>
</ng-template>
