<div class="chartContainer" *ngIf="!isLoading; else box">
  <canvas baseChart
    [data]="pieChartData"
    [labels]="pieChartLabels"
    [chartType]="pieChartType"
    [options]="pieChartOptions"
    [plugins]="pieChartPlugins"
    [legend]="pieChartLegend">
  </canvas>
</div>
<ng-template #box>
  <div class="ssc-square mb"></div>
</ng-template>
