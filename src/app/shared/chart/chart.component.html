<div *ngIf="!isLoading && state; else box" class="chartContainer">
  <div *ngIf="chart && !error; else errorBox">
    <div *ngIf="chart.dataSet && chart.dataSet.length && chart.type">
      <canvas [chartType]="chart.type" [colors]="chart.colors"
              [datasets]="chart.dataSet"
              [labels]="chart.labels"
              [legend]="true"
              [options]="chart.options"
              baseChart class="block">
      </canvas>
    </div>
    <div *ngIf="chart.data && chart.type">
      <canvas [chartType]="chart.type" [colors]="chart.colors"
              [data]="chart.data"
              [labels]="chart.labels"
              [legend]="true"
              [options]="chart.options"
              baseChart class="display: block">
      </canvas>
    </div>
  </div>
  <ng-template #errorBox>
    <app-error [error]="error" [isCard]="true"></app-error>
  </ng-template>
</div>
<ng-template #box>
  <div class="ssc-square"></div>
  <div class="ssc-square"></div>
</ng-template>
