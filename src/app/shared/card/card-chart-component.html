<div class="expanded-chart-frame app-surface-dialog-shell">
  <div class="app-surface-dialog-header expanded-chart-header">
    <div class="app-surface-dialog-title-wrap">
      <div class="app-surface-dialog-badge" aria-hidden="true">
        <mat-icon>insert_chart</mat-icon>
      </div>
      <h1 mat-dialog-title class="app-surface-dialog-title">{{ data.title }}</h1>
    </div>
    <button [mat-dialog-close]="true" class="app-surface-dialog-close close-button" type="button">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div class="app-surface-dialog-divider" aria-hidden="true"></div>
  <div mat-dialog-content class="app-surface-dialog-content expanded-chart-content">
    <app-chart [chartData]="data.chart"></app-chart>
  </div>
</div>
