<h1 mat-dialog-title>{{data.title}}</h1>
<div [innerHTML]="data.content" mat-dialog-content></div>
<div mat-dialog-actions>
  <button (click)="onNoClick" *ngIf="!data.hideNoButton" cdkFocusInitial
          mat-button>{{ 'COMMON.BUTTON.NO' | translate }}</button>
  <button *ngIf="!data.hideOkButton" [mat-dialog-close]="data.value"
          mat-button>{{ 'COMMON.BUTTON.YES' | translate }}</button>
</div>
