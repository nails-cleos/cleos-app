<div class="app-surface-dialog-shell app-surface-dialog-shell--confirm"
     [class.app-surface-dialog-shell--warning]="isWarning">
  <div class="app-surface-dialog-header">
    <div class="app-surface-dialog-title-wrap">
      <div class="app-surface-dialog-badge" aria-hidden="true">
        <mat-icon>{{ icon }}</mat-icon>
      </div>
      <h1 mat-dialog-title class="app-surface-dialog-title">{{ data.title }}</h1>
    </div>
  </div>

  <div class="app-surface-dialog-divider" aria-hidden="true"></div>

  <div class="app-surface-dialog-content" [innerHTML]="data.content" mat-dialog-content></div>

  <div class="app-surface-dialog-divider" aria-hidden="true"></div>

  <div mat-dialog-actions class="app-surface-dialog-actions">
    <div class="app-surface-dialog-spacer"></div>
    <button (click)="onNoClick()" cdkFocusInitial class="app-surface-dialog-action-secondary" mat-flat-button
            type="button">
      {{ 'COMMON.BUTTON.NO' | translate }}
    </button>
    <button [mat-dialog-close]="data.value" [color]="confirmColor" class="app-surface-dialog-action-primary"
            mat-flat-button type="button">
      {{ 'COMMON.BUTTON.YES' | translate }}
    </button>
  </div>
</div>
