<h1 mat-dialog-title>{{ data.title }}</h1>
<div [innerHTML]="data.content" mat-dialog-content></div>
<div mat-dialog-actions>
  @if (!data.hideNoButton) {
    <button (click)="onNoClick" cdkFocusInitial mat-button>
      {{ 'COMMON.BUTTON.NO' | translate }}
    </button>
  }
  @if (!data.hideOkButton) {
    <button [mat-dialog-close]="data.value" mat-button>{{ 'COMMON.BUTTON.YES' | translate }}</button>
  }
</div>
