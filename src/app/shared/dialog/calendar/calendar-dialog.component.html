<h1 mat-dialog-title>{{'COMMON.COLUMN.ACTIONS' | translate}}</h1>
<div mat-dialog-content>
  <mat-radio-group [formControl]="radio" aria-label="Select an option">
    <mat-radio-button value="reservation">{{'COMMON.BUTTON.BOOK' | translate}}</mat-radio-button>
    <mat-radio-button value="unavailable,block-agenda,add">{{'COMMON.BUTTON.BLOCK_AGENDA' | translate}}</mat-radio-button>
    <mat-radio-button value="unavailable,add">{{'COMMON.BUTTON.UNAVAILABLE' | translate}}</mat-radio-button>
  </mat-radio-group>
</div>
<div mat-dialog-actions>
  <button (click)="onNoClick" mat-button>{{ 'COMMON.BUTTON.CANCEL' | translate }}</button>
  <button [mat-dialog-close]="radio.value" cdkFocusInitial color="primary"
          mat-button>Ok
  </button>
</div>
