<h1 mat-dialog-title>{{ 'COMMON.RESERVATION.EDIT.TITLE' | translate }}</h1>
<div mat-dialog-content>
  <p>{{ 'COMMON.RESERVATION.EDIT.TEXT' | translate: { penalty: penalty } }}</p>
</div>
<div mat-dialog-actions class="card-actions">
  <div class="spacer"></div>
  @if (small) {
    <button (click)="onNoClick()" mat-fab>
      <mat-icon>clear</mat-icon>
    </button>
    <button (click)="doAction()" cdkFocusInitial color="primary" mat-fab>
      <mat-icon>forward</mat-icon>
    </button>
  } @else {
    <button (click)="onNoClick()" mat-fab extended class="icon-button">{{ 'COMMON.BUTTON.CANCEL' | translate }}</button>
    <button (click)="doAction()" cdkFocusInitial color="primary" mat-fab extended class="icon-button">Ok</button>
  }
</div>
