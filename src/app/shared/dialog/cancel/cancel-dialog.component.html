<div class="app-surface-dialog-shell app-surface-dialog-shell--warning">
  <div class="app-surface-dialog-header">
    <div class="app-surface-dialog-title-wrap">
      <div class="app-surface-dialog-badge" aria-hidden="true">
        <mat-icon>event_busy</mat-icon>
      </div>
      <h1 mat-dialog-title class="app-surface-dialog-title">
        {{ 'RESERVATION.CANCEL.TITLE' | translate }}
      </h1>
    </div>
  </div>

  <div mat-dialog-content class="app-surface-dialog-content">
    <form [formGroup]="form" (keydown.enter)="$event.preventDefault()">
      <app-price
        [price]="price"
        [typeForm]="typeForm"
        [options]="paymentOptions"
        [currency]="currency"
        [firstTime]="showBank"
        [showPenalty]="showPenalty"
        [showBank]="showBank"
        [includeBalance]="false"
      ></app-price>
      <div class="top-space">
        <mat-label>{{ 'RESERVATION.CANCEL.FIELD' | translate }}</mat-label>
        <mat-radio-group
          class="radio-group"
          [formControl]="getForm.paymentCancellation"
        >
          @for (option of options; track option) {
            <mat-radio-button class="radio-button" [value]="option">
              <div
                [innerHTML]="
                  'RESERVATION.CANCEL.OPTION.' + option
                    | translate: { penalty: penalty }
                "
              ></div>
            </mat-radio-button>
          }
        </mat-radio-group>
        @if (getForm.paymentCancellation.hasError('required')) {
          <mat-error
            [innerHTML]="'RESERVATION.CANCEL.REQUIRED' | translate"
          ></mat-error>
        }
      </div>
    </form>
  </div>

  <div mat-dialog-actions class="app-surface-dialog-actions">
    <div class="app-surface-dialog-spacer"></div>
    <button (click)="onNoClick()" mat-stroked-button type="button">
      {{ 'COMMON.BUTTON.CANCEL' | translate }}
    </button>
    <button
      (click)="doAction()"
      cdkFocusInitial
      color="primary"
      [disabled]="form.invalid || typeForm.invalid"
      mat-flat-button
      type="button"
    >
      Ok
    </button>
  </div>
</div>
