<ng-template [ngIf]="price" [ngIfElse]="noPrice">
  <div [innerHTML]="'COMMON.PAYMENT.OPTIONS.PAID' | translate: {amount: price.totalPaid | number:'1.2-2',
                   symbol: currency | currencySymbol}"></div>

  <div [innerHTML]="'COMMON.PAYMENT.OPTIONS.PENALTY' | translate: {amount: price.penalty | number:'1.2-2',
                   symbol: currency | currencySymbol}"></div>

  <ng-template [ngIf]="showPenalty">
    <ng-template [ngIf]="price.totalPaid - price.penalty > 0">
      <div [innerHTML]="'COMMON.PAYMENT.OPTIONS.D_OR_R' | translate: {
          amount: (price.totalPaid - price.penalty )| number:'1.2-2', symbol: currency | currencySymbol}"></div>
    </ng-template>

    <ng-template [ngIf]="price.penalty - price.totalPaid > 0">
      <div [innerHTML]="'COMMON.PAYMENT.OPTIONS.TO_PAY' | translate: {
          amount: (price.penalty - price.totalPaid) | number:'1.2-2', symbol: currency | currencySymbol}"></div>
    </ng-template>

    <ng-template [ngIf]="showBank && price.penalty > price.totalPaid">
      <app-bank [firstTime]="firstTime" [formGroup]="typeForm" [types]="types" [professionalName]="professionalName"
                (percentageEmitter)="emitter($event)"></app-bank>
    </ng-template>
  </ng-template>

  <ng-template [ngIf]="showBank">
    <mat-divider></mat-divider>
  </ng-template>
</ng-template>

<ng-template #noPrice>
  <ng-template [ngIf]="showBank">
    <app-bank [firstTime]="firstTime" [formGroup]="typeForm" [types]="types" [professionalName]="professionalName"
              (percentageEmitter)="emitter($event)"></app-bank>
  </ng-template>
</ng-template>
