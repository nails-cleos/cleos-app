@if (itemsSignal(); as items) {
  <app-drag-drop-sorting [title]="'ADDITIONAL.DETAIL' | translate" [items]="items"
                         (sorted)="sorted($event)"></app-drag-drop-sorting>
} @else {
  <div class="app-surface-canvas app-surface-shell app-surface-stack">
    <section class="app-surface-section app-crud-loading">
      <div class="app-surface-skeleton-spacer"></div>
      <div class="ssc-square app-crud-loading__block"></div>
      <div class="app-surface-skeleton-spacer"></div>
    </section>
  </div>
}
