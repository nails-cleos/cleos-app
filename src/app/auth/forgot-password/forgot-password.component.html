<div class="app-surface-canvas app-surface-shell forgot-password-page">
  <div class="app-surface-stack">
    <section class="app-surface-hero app-detail-panel forgot-password-hero">
      <div class="app-surface-eyebrow">{{ 'AUTH.FORGOT_PASSWORD.TITLE' | translate }}</div>

      <form class="app-surface-stack"
            (ngSubmit)="forgotPassword()"
            [formGroup]="form"
            novalidate
            (keydown.enter)="$event.preventDefault()">
          <div class="forgot-password-copy">
            <p class="forgot-password-copy__text">
              {{ 'AUTH.FORGOT_PASSWORD.MESSAGE' | translate }}
            </p>
          </div>

          <div class="forgot-password-form-grid">
            <mat-form-field appearance="outline">
              <mat-label>{{ 'AUTH.FORGOT_PASSWORD.EMAIL.FIELD' | translate }}</mat-label>
              <input autocomplete="email" [formControl]="getForm.email" matInput required>
              <mat-error>
                {{ 'AUTH.FORGOT_PASSWORD.EMAIL.ERROR' | translate }}
              </mat-error>
            </mat-form-field>
          </div>

          <div class="app-detail-actions forgot-password-actions">
            <div class="app-surface-spacer"></div>
            <button [form]="form" appBackButton mat-stroked-button type="button">
              <mat-icon>keyboard_return</mat-icon>
              {{ 'COMMON.BUTTON.BACK' | translate }}
            </button>
            <button [disabled]="form.invalid" mat-stroked-button type="submit">
              <mat-icon>mail</mat-icon>
              {{ 'COMMON.BUTTON.SEND' | translate }}
            </button>
          </div>
      </form>
    </section>
  </div>
</div>
