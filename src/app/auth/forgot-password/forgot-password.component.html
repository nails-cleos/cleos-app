<div class="flex-container" fxLayout="column">
  <div class="card-container" fxLayout="row" fxLayout.xs="column" fxLayoutAlign="center">
    <div fxFlex="60%" fxFlex.lt-sm="80%">
      <form (ngSubmit)="forgotPassword" [formGroup]="form" novalidate>
        <mat-card appearance="outlined">
          <mat-card-header>
            <mat-card-title>{{ 'AUTH.FORGOT_PASSWORD.TITLE' | translate }}</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <div fxLayout="column" fxLayoutAlign="space-evenly stretch">
              <mat-form-field appearance="outline">
                <mat-label>{{ 'AUTH.FORGOT_PASSWORD.EMAIL.FIELD' | translate }}</mat-label>
                <input autocomplete="email" formControlName="email" matInput required>
                <mat-error>
                  {{ 'AUTH.FORGOT_PASSWORD.EMAIL.ERROR' | translate }}
                </mat-error>
              </mat-form-field>
            </div>
          </mat-card-content>
          <mat-card-actions>
            <div fxFlex></div>
            <button [form]="form" appBackButton color="accent" mat-fab extended class="icon-button"
                    type="button">{{ 'COMMON.BUTTON.BACK' | translate }}</button>
            <button [disabled]="form.invalid" color="primary" mat-fab extended class="icon-button"
                    type="submit">{{ 'COMMON.BUTTON.SEND' | translate }}</button>
          </mat-card-actions>
        </mat-card>
      </form>
    </div>
  </div>
</div>
