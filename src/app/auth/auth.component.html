<div class="flex-container" fxLayout="column">
  <div class="card-container" fxLayout="row" fxLayout.xs="column" fxLayoutAlign="center">
    <div fxFlex="60%" fxFlex.lt-sm="80%">
      <mat-card appearance="outlined">
        <mat-card-header>
          <mat-card-title>{{ 'AUTH.SIGN_IN.TITLE' | translate }}</mat-card-title>
        </mat-card-header>
        <mat-divider></mat-divider>
        <mat-card-content>
          <div fxLayout="column" fxLayoutAlign="space-evenly stretch">
            <div id="firebaseui-auth-container"></div>
            <mat-form-field appearance="outline">
              <mat-label>{{ 'AUTH.SIGN_IN.CODE.FIELD' | translate }}</mat-label>
              <label>
                <input [formControl]="codeForm" matInput autocomplete="one-time-code">
              </label>
            </mat-form-field>
          </div>
          <div fxLayout="column" fxLayoutAlign="space-evenly start">
            <a type="button" routerLink="/auth/forgot-password">{{ 'AUTH.SIGN_IN.FORGOT_PASSWORD' | translate }}</a>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
