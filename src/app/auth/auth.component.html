<div class="flex-container" fxLayout="column">
  <div class="card-container" fxLayout="row" fxLayout.xs="column" fxLayoutAlign="center">
    <div fxFlex="50%" fxFlex.gt-lg="40%" fxFlex.lt-sm="80%">
      <mat-card *ngIf="!isLoading; else boxSkeleton">
        <mat-tab-group #authGroup>
          <mat-tab label="{{ 'AUTH.SIGN_IN.TITLE' | translate }}">
            <mat-card-content>
              <div fxLayout="column" fxLayoutAlign="space-evenly stretch">
                <button (click)="socialSignIn('google')" mat-button>
                  <img alt="Google login" class="social" src="https://developers.google.com/identity/images/g-logo.png"
                       width="15px"/>
                  Google
                </button>
                <button (click)="socialSignIn('facebook')" color="facebook" mat-raised-button>
                  <mat-icon>facebook</mat-icon>
                  Facebook
                </button>
              </div>
              <div class="divider">
                <mat-divider></mat-divider>
              </div>
              <div class="divider-padding" fxLayout="column" fxLayoutAlign="space-evenly center">
                <b>{{ 'AUTH.SIGN_IN.OR' | translate }}</b>
              </div>
              <app-sign-in></app-sign-in>
              <div class="divider">
                <p>
                  {{ 'AUTH.SIGN_IN.NEW' | translate }}
                  <a (click)="authGroup.selectedIndex=1" [routerLink]="">{{ 'AUTH.SIGN_UP.TITLE' | translate }}!</a>
                </p>
              </div>
            </mat-card-content>
          </mat-tab>
          <mat-tab label="{{ 'AUTH.SIGN_UP.TITLE' | translate }}">
            <mat-card-content>
              <div fxLayout="column" fxLayoutAlign="space-evenly stretch">
                <button (click)="socialSignIn('google')" mat-button>
                  <img alt="Google login" class="social" src="https://developers.google.com/identity/images/g-logo.png"
                       width="15px"/>
                  Google
                </button>
                <button (click)="socialSignIn('facebook')" color="facebook" mat-raised-button>
                  <mat-icon>facebook</mat-icon>
                  Facebook
                </button>
              </div>
              <div class="divider">
                <mat-divider></mat-divider>
              </div>
              <div class="divider-padding" fxLayout="column" fxLayoutAlign="space-evenly center">
                <b>{{ 'AUTH.SIGN_UP.OR' | translate }}</b>
              </div>
              <app-sign-up></app-sign-up>
              <div class="divider">
                <p>
                  {{ 'AUTH.SIGN_UP.ALREADY' | translate }}
                  <a (click)="authGroup.selectedIndex=0" [routerLink]="">{{ 'AUTH.SIGN_IN.TITLE' | translate }}!</a>
                </p>
              </div>
            </mat-card-content>
          </mat-tab>
        </mat-tab-group>
      </mat-card>
      <ng-template #boxSkeleton>
        <div class="ssc-hr"></div>
        <div class="ssc-square mb"></div>
        <div class="ssc-hr"></div>
      </ng-template>
    </div>
  </div>
</div>
