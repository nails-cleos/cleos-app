<div *ngIf="state; else box" class="chartContainer">
  <div *ngIf="!error; else errorBox">
    <canvas [chartType]="radarChartType"
            [datasets]="radarChartData"
            [labels]="radarChartLabels"
            [options]="radarChartOptions"
            [colors]="radarChartColors"
            baseChart>
    </canvas>
  </div>
  <ng-template #errorBox>
    <app-error [error]="error" [isCard]="true"></app-error>
  </ng-template>
</div>
<ng-template #box>
  <div class="ssc-square mb"></div>
</ng-template>
