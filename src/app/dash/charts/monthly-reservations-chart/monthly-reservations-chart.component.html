<div *ngIf="state; else box" class="chartContainer">
  <div *ngIf="!error; else errorBox">
    <canvas [chartType]="pieChartType"
            [colors]="pieChartColors"
            [data]="pieChartData"
            [labels]="pieChartLabels"
            [legend]="pieChartLegend"
            [options]="pieChartOptions"
            [plugins]="pieChartPlugins"
            baseChart>
    </canvas>
  </div>
  <ng-template #errorBox>
    <app-error [error]="error" [isCard]="true"></app-error>
  </ng-template>
</div>
<ng-template #box>
  <div class="ssc-square mb"></div>
</ng-template>
