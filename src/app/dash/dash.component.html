<!--Calendar-->
<mat-card>
  <mat-card-header>
    <mat-card-title>{{ viewDate | calendarDate:(view + 'ViewTitle'):locale }}<span
      *ngIf="!isCalendarLoading" [innerHTML]="'DASHBOARD.TOTAL_RESERVATIONS' | translate: {total: total}"></span>
    </mat-card-title>
    <mat-card-subtitle *ngIf="!isCalendarLoading" class="calendar-title">
      <button (click)="changeDate()" (viewDateChange)="closeOpenMonthViewDay()" [(viewDate)]="viewDate" [view]="view"
              color="accent" mat-raised-button mwlCalendarPreviousView>
        <mat-icon>navigate_before</mat-icon>
        <span fxHide.lt-sm fxShow>{{'COMMON.BUTTON.PREVIOUS' | translate}}</span>
      </button>
      <button (click)="changeDate()" [(viewDate)]="viewDate" class="btn btn-outline-secondary" color="accent"
              mat-raised-button mwlCalendarToday>
        <mat-icon>today</mat-icon>
        <span fxHide.lt-sm fxShow>{{'COMMON.BUTTON.TODAY' | translate}}</span>
      </button>
      <button (click)="changeDate()" (viewDateChange)="closeOpenMonthViewDay()" [(viewDate)]="viewDate" [view]="view"
              color="accent" mat-raised-button mwlCalendarNextView>
        <span fxHide.lt-sm fxShow>{{'COMMON.BUTTON.NEXT' | translate}}</span>
        <mat-icon>navigate_next</mat-icon>
      </button>
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content *ngIf="!isCalendarLoading; else calendarLoading">
    <mwl-calendar-month-view (dayClicked)="dayClicked($event.day)" (eventClicked)="handleEvent($event.event)"
                             [activeDayIsOpen]="activeDayIsOpen" [events]="events" [locale]="locale"
                             [viewDate]="viewDate"></mwl-calendar-month-view>
  </mat-card-content>
  <ng-template #calendarLoading>
    <div class="ssc-square mb"></div>
  </ng-template>
</mat-card>
<mat-grid-list cols="{{cardLayout.columns }}" rowHeight="200px">
  <!--Mini Cards-->
  <mat-grid-tile *ngFor="let mc of miniCardData" [colspan]="cardLayout.miniCard?.cols"
                 [rowspan]="cardLayout.miniCard?.rows">
    <app-mini-card [color]="mc.color" [duration]="'DASHBOARD.MINI_CARD.DURATION' | translate" [error]="mc.error"
                   [icon]="mc.icon" [isCurrency]="mc.currency" [isIncrease]="mc.increase"
                   [percentValue]="mc.percentValue" [title]="mc.title | translate"
                   [value]="mc.value"></app-mini-card>
  </mat-grid-tile>
  <!--Charts-->
  <mat-grid-tile *ngFor="let chart of charts" [colspan]="cardLayout.chart?.cols" [rowspan]="cardLayout.chart?.rows">
    <app-card [chart]="chart" [isDark]="isDarkMode" [title]="chart.title">
      <app-chart [chartSummary]="chart" [isDark]="isDarkMode" [state]="state"></app-chart>
    </app-card>
  </mat-grid-tile>
  <!--Table-->
  <mat-grid-tile [colspan]="cardLayout.table?.cols" [rowspan]="cardLayout.table?.rows">
    <app-card [expand]="false" [title]="'DASHBOARD.CARD.RESERVATION' | translate">
      <app-reservation-table></app-reservation-table>
    </app-card>
  </mat-grid-tile>
</mat-grid-list>
