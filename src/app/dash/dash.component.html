<h1 class="mat-h1">Dashboard</h1>
<mat-grid-list cols="{{ ( cardLayout | async )?.columns }}" rowHeight="200px">
  <!--Mini Cards-->
  <mat-grid-tile *ngFor="let mc of miniCardData" [colspan]="( cardLayout | async )?.miniCard?.cols"
                 [rowspan]="( cardLayout | async )?.miniCard?.rows">
    <app-mini-card [color]="mc.color" [icon]="mc.icon" [isCurrency]="mc. isCurrency" [isIncrease]="mc.isIncrease"
                   [percentValue]="mc.percentValue"
                   [title]="mc.title" [value]="mc.value"
                   duration="DASHBOARD.MINI_CARD.DURATION"></app-mini-card>
  </mat-grid-tile>
  <!--Charts-->
  <mat-grid-tile [colspan]="( cardLayout | async )?.chart?.cols" [rowspan]="( cardLayout | async )?.chart?.rows">
    <app-card [data]="state?.data" [label]="quantityLabel" title="QUANTITY_PRODUCT">
      <app-quantity-product-reservations-chart [label]="quantityLabel"
                                               [state]="state"></app-quantity-product-reservations-chart>
    </app-card>
  </mat-grid-tile>
  <mat-grid-tile [colspan]="( cardLayout | async )?.chart?.cols" [rowspan]="( cardLayout | async )?.chart?.rows">
    <app-card [data]="state?.data" title="PRODUCT_RESERVATION">
      <app-product-reservations-chart [state]="state"></app-product-reservations-chart>
    </app-card>
  </mat-grid-tile>
  <mat-grid-tile [colspan]="( cardLayout | async )?.chart?.cols" [rowspan]="( cardLayout | async )?.chart?.rows">
    <app-card [data]="state?.data" title="MONTHLY_RESERVATION">
      <app-monthly-reservation-chart [state]="state"></app-monthly-reservation-chart>
    </app-card>
  </mat-grid-tile>
  <mat-grid-tile [colspan]="( cardLayout | async )?.chart?.cols" [rowspan]="( cardLayout | async )?.chart?.rows">
    <app-card [data]="state?.data" [label]="annualLabel" title="YEARLY_PRODUCT_PRICE">
      <app-annual-reservations-chart [label]="annualLabel" [state]="state"></app-annual-reservations-chart>
    </app-card>
  </mat-grid-tile>
  <mat-grid-tile [colspan]="( cardLayout | async )?.chart?.cols" [rowspan]="( cardLayout | async )?.chart?.rows">
    <app-card [data]="state?.data" [label]="customerLabel" title="CUSTOMER_RESERVATION">
      <app-customer-reservations-chart [label]="customerLabel" [state]="state"></app-customer-reservations-chart>
    </app-card>
  </mat-grid-tile>
  <mat-grid-tile [colspan]="( cardLayout | async )?.chart?.cols" [rowspan]="( cardLayout | async )?.chart?.rows">
    <app-card [data]="state?.data" [label]="lastMonthLabel" title="LAST_MONTH_RESERVATION">
      <app-last-month-reservations-chart [label]="lastMonthLabel" [state]="state"></app-last-month-reservations-chart>
    </app-card>
  </mat-grid-tile>
  <!--Table-->
  <mat-grid-tile [colspan]="( cardLayout | async )?.table?.cols" [rowspan]="( cardLayout | async )?.table?.rows">
    <app-card [expand]="false" title="RESERVATION">
      <app-reservation-table></app-reservation-table>
    </app-card>
  </mat-grid-tile>
</mat-grid-list>
