<mat-sidenav-container>
  <mat-sidenav #drawer class="sidenav" fixedInViewport
               [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
               [mode]="(isHandset$ | async) ? 'over' : 'side'"
               [opened]="(isHandset$ | async) === false">
    <mat-card *ngIf="currentUser">
      <mat-card-header>
        <div mat-card-avatar class="circle" [ngStyle]="{'background-color':  '#673AB7' }">
          <img *ngIf="!showInitials; else showInitialsBlock" src="{{currentUser?.imageUrl}}" alt="profile">
          <ng-template #showInitialsBlock>
            <div class="initials">{{ initials | uppercase }}</div>
          </ng-template>
        </div>
        <mat-card-title>{{username | uppercase}}</mat-card-title>
        <mat-card-subtitle>{{currentUser.email}}</mat-card-subtitle>
      </mat-card-header>
    </mat-card>
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a *ngFor="let item of menuItems" mat-list-item [routerLink]="'/'+item"> {{item | titlecase}} </a>
      <mat-divider></mat-divider>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        (click)="drawer.toggle()"
        *ngIf="isHandset$ | async">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <span>{{title}}</span>
      <span class="align-right"></span>
      <button mat-raised-button color="accent" [matMenuTriggerFor]="menuNotLogged" *ngIf="username; else login">
        <mat-icon>person_pin</mat-icon>
        {{username | titlecase}}
      </button>
      <ng-template #login>
        <button mat-raised-button color="accent" routerLink="/auth">
          <mat-icon>login</mat-icon>
          {{'DASHBOARD.SIGN_IN' | translate }}
        </button>
      </ng-template>
      <mat-menu #menuNotLogged="matMenu">
        <button mat-menu-item routerLink="/profile">
          <mat-icon>settings</mat-icon>
          <span>{{'DASHBOARD.PROFILE' | translate }}</span>
        </button>
        <button mat-menu-item routerLink="/change-password" *ngIf="canChangePassword">
          <mat-icon>mode_edit</mat-icon>
          <span>{{'DASHBOARD.CHANGE_PASSWORD' | translate }}</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>exit_to_app</mat-icon>
          <span>{{'DASHBOARD.SIGN_OUT' | translate }}</span>
        </button>
      </mat-menu>
    </mat-toolbar>
    <div class="grid-container">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
