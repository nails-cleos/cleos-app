name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAMROLE_GITHUB }}
          role-session-name: GitHub-Action-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        run: ./scripts/amplify-deploy.sh ${{ vars.AMPLIFY_APP_ID }} main

      - name: Add Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Amplify Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** $(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Name:** ${{ vars.AMPLIFY_APP_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch Deployed:** main" >> $GITHUB_STEP_SUMMARY
          echo "- **AWS Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Deployment completed successfully**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment failed**" >> $GITHUB_STEP_SUMMARY
          fi
