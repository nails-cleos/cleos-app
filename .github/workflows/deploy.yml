name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on tags matching this pattern

env:
  IMAGE_NAME: d1d8fh8tgyhz8m
  AWS_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v3

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-session-name: GitHub-Action-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine branch from tag
        id: branch_from_tag
        run: echo "::set-output name=branch::$(git branch --contains ${{ github.sha }} --sort=-committerdate | head -n 1 | cut -c 3-)"

      - name: Deploy from branch
        run: |
          git checkout ${{ steps.branch_from_tag.outputs.branch }}
          ./scripts/amplify-deploy.sh ${{ env.IMAGE_NAME }} ${{ steps.branch_from_tag.outputs.branch }}
