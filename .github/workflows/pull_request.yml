name: Pull request flow

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches:
      - 'develop'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      TZ: "Europe/Amsterdam"

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 22.14.0
        uses: actions/setup-node@v3
        with:
          node-version: 22.14.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build --if-present

      - name: Run lint
        run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    needs: build-and-lint
    env:
      TZ: "Europe/Amsterdam"

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 22.14.0
        uses: actions/setup-node@v3
        with:
          node-version: 22.14.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --code-coverage --watch=false --browsers=ChromeHeadless
        continue-on-error: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/cleos/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage Report
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/cleos/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [build-and-lint, unit-tests]
    env:
      TZ: "Europe/Amsterdam"

    strategy:
      matrix:
        containers: [ 1, 2 ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 22.14.0
        uses: actions/setup-node@v3
        with:
          node-version: 22.14.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build --if-present

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run serve
          wait-on: 'http://localhost:4300'
          record: true
          parallel: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
