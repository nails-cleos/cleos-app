name: Continue Integration flow

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      TZ: 'Europe/Amsterdam'

    steps:
      - uses: actions/checkout@v6

      - name: Start timer
        run: echo "JOB_START=$(date +%s)" >> $GITHUB_ENV

      - name: Use Node.js 24.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: |
          npx tsc -b tsconfig.check.json --noEmit
          echo "TYPE_CHECK_STATUS=$?" >> $GITHUB_ENV

      - name: Build production app
        shell: bash
        run: |
          set +e
          npm run build
          BUILD_STATUS=$?
          echo "BUILD_STATUS=$BUILD_STATUS" >> "$GITHUB_ENV"
          exit "$BUILD_STATUS"

      - name: Run lint
        run: |
          npm run lint
          echo "LINT_STATUS=$?" >> $GITHUB_ENV

      - name: Build & Lint summary
        if: always()
        run: |
          DURATION=$(( $(date +%s) - $JOB_START ))

          status_icon () {
            if [ "$1" -eq 0 ]; then echo "✅ Passed"; else echo "❌ Failed"; fi
          }

          echo "## 🏗 Build & Lint" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | $(status_icon $TYPE_CHECK_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | $(status_icon $BUILD_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | $(status_icon $LINT_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🕗 Duration: ${DURATION}s" >> $GITHUB_STEP_SUMMARY

  unit-tests:
    runs-on: ubuntu-latest
    needs: build-and-lint
    env:
      TZ: 'Europe/Amsterdam'

    steps:
      - uses: actions/checkout@v6

      - name: Start timer
        run: echo "JOB_START=$(date +%s)" >> $GITHUB_ENV

      - name: Use Node.js 24.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        shell: bash
        run: |
          set +e
          node --max-old-space-size=4096 ./node_modules/@angular/cli/bin/ng test --coverage --watch=false 2>&1 | tee unit-test.log
          TEST_STATUS=${PIPESTATUS[0]}
          echo "TEST_STATUS=$TEST_STATUS" >> $GITHUB_ENV
          exit $TEST_STATUS

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/cleos/lcov.info
          flags: unittests
          name: codecov
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage Report Comment
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          lcov-file: ./coverage/cleos/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: coverage/cleos/
          retention-days: 7

      - name: Unit test & coverage summary
        if: always()
        run: |
          DURATION=$(( $(date +%s) - $JOB_START ))

          echo "## 🧪 Unit Tests & Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Extract test results
          if [ -f "test-results/junit-report.xml" ]; then
            node -e "
              const fs = require('fs');
              const xml = fs.readFileSync('test-results/junit-report.xml', 'utf8');
              const log = fs.existsSync('unit-test.log') ? fs.readFileSync('unit-test.log', 'utf8') : '';
              const getAttr = (name) => {
                const match = xml.match(new RegExp(name + '=\"([^\"]+)\"'));
                return match ? match[1] : undefined;
              };
              const tests = Number(getAttr('tests') || 0);
              const failures = Number(getAttr('failures') || 0);
              const errors = Number(getAttr('errors') || 0);
              const pending = Number(getAttr('pending') || getAttr('disabled') || 0);
              const skipped = Number(getAttr('skipped') || 0);
              const duration = getAttr('time') || '0';
              const failed = failures + errors;
              const passed = Math.max(tests - failed - pending - skipped, 0);
              const testStatus = Number(process.env.TEST_STATUS || 0);
              const disconnected = /DISCONNECTED/.test(log);
              const result = failed === 0 && testStatus === 0 && !disconnected ? 'Passing ✅' : 'Failing ❌';

              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                '### Test Results\\n\\n' +
                '| Result | Passed ✅ | Failed ❌ | Pending ✋ | Skipped ↩️ | Duration 🕗 |\\n' +
                '|--------|-----------|-----------|------------|-------------|------------|\\n' +
                '| ' + result + ' | ' + passed + ' | ' + failed + ' | ' + pending + ' | ' + skipped + ' | ' + duration + 's |\\n\\n'
              );
            "
          else
            echo "### Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Result | Passed ✅ | Failed ❌ | Pending ✋ | Skipped ↩️ | Duration 🕗 |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-----------|-----------|------------|-------------|------------|" >> $GITHUB_STEP_SUMMARY
            echo "| No report found ❌ | 0 | 0 | 0 | 0 | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Coverage
          FILE=./coverage/cleos/coverage-summary.json
          if [ -f "$FILE" ]; then
            node -e "
              const summary = require('$FILE').total;
              const toNumber = v => typeof v === 'number' ? v : Number.parseFloat(String(v));
              const format = v => {
                const value = toNumber(v);
                return Number.isFinite(value) ? value.toFixed(2) + '%' : 'N/A';
              };
              const fs = require('fs');
              const linesPct = toNumber(summary.lines.pct);

              const status = linesPct >= 80 ? '🟢 Good'
                           : linesPct >= 70 ? '🟡 Warning'
                           : Number.isFinite(linesPct) ? '🔴 Low'
                           : '🔴 Low';

              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                '### Coverage\n\n' +
                '| Metric | Coverage |\n|--------|----------|\n' +
                '| Lines | ' + format(summary.lines.pct) + ' |\n' +
                '| Statements | ' + format(summary.statements.pct) + ' |\n' +
                '| Functions | ' + format(summary.functions.pct) + ' |\n' +
                '| Branches | ' + format(summary.branches.pct) + ' |\n\n' +
                '**Overall Status:** ' + status + '\n\n'
              );
            "
          fi

          echo "- 🕗 Duration: ${DURATION}s" >> $GITHUB_STEP_SUMMARY

  e2e-tests:
    name: E2E (${{ matrix.containers }})
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2]
    runs-on: ubuntu-latest
    needs: build-and-lint
    env:
      TZ: 'Europe/Amsterdam'

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Cypress
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run serve
          wait-on: 'http://localhost:4300'
          record: true
          parallel: true
          group: e2e
          ci-build-id: ${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
