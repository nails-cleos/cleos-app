name: Release

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"

### Increments the part of the version
### Options for version parts: major, minor, patch
env:
  VERSION_PART: 'minor'

jobs:
  snapshot:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Configure Git
        run: |
          git config --global user.email "nails.cleos@gmail.com"
          git config --global user.name "Nails Cleos"
          git fetch
          git checkout develop

      - name: Make script executable
        run: chmod +x "${GITHUB_WORKSPACE}/version-update.sh"

      - name: Run snapshot bump
        run: |
          "${GITHUB_WORKSPACE}/version-update.sh" $VERSION_PART
          git commit -am "Update rc version"
          git push

  version:
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Configure Git
        run: |
          git config --global user.email "nails.cleos@gmail.com"
          git config --global user.name "Nails Cleos"
          git fetch
          git checkout main

      - name: Make script executable
        run: chmod +x "${GITHUB_WORKSPACE}/version-update.sh"

      - name: Release version
        id: version
        run: |
          VERSION=$("${GITHUB_WORKSPACE}/version-update.sh")
          git commit -am "Release version $VERSION"
          git push
