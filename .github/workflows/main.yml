name: Update version

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"

jobs:
  version:
    if: github.event_name == 'push'

    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.VERSION_NAME }}

    steps:
      - uses: actions/checkout@v2

      - name: Release version
        id: version
        run: |
          git config --global user.email "espaciocleos@gmail.com"
          git config --global user.name "Espacio Cleos"
          git fetch
          # make file runnable, might not be necessary
          chmod +x "${GITHUB_WORKSPACE}/version-update.sh"

          # run script
          VERSION=$("${GITHUB_WORKSPACE}/version-update.sh")
          echo "::set-output name=VERSION_NAME::$VERSION"
          git commit -am "Update release version $VERSION"
          git push

  release:
    needs: version

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Create tag
        run: |
          echo "Create tag v${{ needs.version.outputs.version_name }}"
          git tag -a "v${{ needs.version.outputs.version_name }}" -m "New release for v${{ needs.version.outputs.version_name }}"
          git push --tags

  snapshot:
    needs: [ version, release ]

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Update rc version
        run: |
          git config --global user.email "espaciocleos@gmail.com"
          git config --global user.name "Espacio Cleos"
          git fetch
          git checkout develop
          # make file runnable, might not be necessary
          chmod +x "${GITHUB_WORKSPACE}/version-update.sh"

          # run script
          "${GITHUB_WORKSPACE}/version-update.sh" true
          git commit -am "Update rc version"
          git push
