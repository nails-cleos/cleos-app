name: Release

on:
  push:
    branches:
      - 331-create-release-branch
    tags-ignore:
      - "**"

### Increments the part of the string
## $1: version itself
## $2: number of part: 0 – major, 1 – minor, 2 – patch
env:
  VERSION_PART: '2'

