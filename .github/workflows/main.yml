name: Versioning

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

### Increments the part of the version
### Used only if the finalized RC tag already exists.
### Options for version parts: major, minor, patch
env:
  VERSION_PART: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_version: ${{ steps.release.outputs.release_version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "nails.cleos@gmail.com"
          git config --global user.name "Nails Cleos"
          git checkout "${GITHUB_REF_NAME}"

      - name: Use Node.js 24.12.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: 'npm'

      - name: Make script executable
        run: chmod +x "${GITHUB_WORKSPACE}/version-update.sh"

      - name: Release version
        id: release
        run: |
          VERSION=$("${GITHUB_WORKSPACE}/version-update.sh")
          TAG_NAME="v${VERSION}"
          RELEASE_CREATED=false

          git fetch --tags origin

          while git rev-parse "${TAG_NAME}" >/dev/null 2>&1; do
            TAG_COMMIT="$(git rev-list -n 1 "${TAG_NAME}")"
            HEAD_COMMIT="$(git rev-parse HEAD)"

            if [ "${TAG_COMMIT}" = "${HEAD_COMMIT}" ]; then
              echo "Tag ${TAG_NAME} already exists on this commit; skipping release creation."
              echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
              echo "release_created=${RELEASE_CREATED}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Tag ${TAG_NAME} already exists on ${TAG_COMMIT}; bumping ${VERSION_PART} before release."
            VERSION=$("${GITHUB_WORKSPACE}/version-update.sh" release "${VERSION_PART}")
            TAG_NAME="v${VERSION}"
          done

          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "Release version ${VERSION}"
            git push origin "${GITHUB_REF_NAME}"
          fi

          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "${TAG_NAME}"
          RELEASE_CREATED=true

          echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_created=${RELEASE_CREATED}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.release.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: ${{ steps.release.outputs.tag_name }}
          generate_release_notes: true

      - name: Add Release Summary
        if: always()
        run: |
          echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "- **Released Version:** ${{ steps.release.outputs.release_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.release.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New Release Created:** ${{ steps.release.outputs.release_created }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Release completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Release failed" >> $GITHUB_STEP_SUMMARY
          fi

  snapshot:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "nails.cleos@gmail.com"
          git config --global user.name "Nails Cleos"
          git fetch origin main develop --tags
          git checkout -B develop origin/develop
          git pull --ff-only origin develop
          git merge --no-edit origin/main

      - name: Use Node.js 24.12.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: 'npm'

      - name: Make script executable
        run: chmod +x "${GITHUB_WORKSPACE}/version-update.sh"

      - name: Run snapshot bump
        id: snapshot
        run: |
          VERSION=$("${GITHUB_WORKSPACE}/version-update.sh" rc)

          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "Update rc version to ${VERSION}"
            git push origin develop
          fi

          echo "snapshot_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Add Snapshot Summary
        if: always()
        run: |
          echo "## 🔁 Snapshot Version Bump" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** push to main" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Branch:** develop" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Part Incremented:** ${{ env.VERSION_PART }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Next RC Version:** ${{ steps.snapshot.outputs.snapshot_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Snapshot version updated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Snapshot version bump failed" >> $GITHUB_STEP_SUMMARY
          fi

  deploy:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/cd.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    with:
      release_version: ${{ needs.release.outputs.release_version }}
      tag_name: ${{ needs.release.outputs.tag_name }}
