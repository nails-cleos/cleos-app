user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    upstream backend {
            server localhost:8443;
    }

    server {
            listen       80;
            listen  [::]:80;
            server_name  espaciocleos.com www.espaciocleos.com;

            #location / {
            #    root   /usr/share/nginx/html;
            #    index  index.html index.htm;
            #    try_files $uri $uri/ /index.html;
            # }

            location / {
                    rewrite ^ https://$host$request_uri? permanent;
            }
    }

   server {
           listen 443 ssl http2;
           listen [::]:443 ssl http2;
           server_name espaciocleos.com www.espaciocleos.com;

           server_tokens off;

           ssl_certificate /etc/nginx/certs/espaciocleos.com.crt.pem;
           ssl_certificate_key /etc/nginx/certs/espaciocleos.com.key;

           ssl_buffer_size 8k;

           ssl_protocols TLSv1.2 TLSv1.1 TLSv1;
           ssl_prefer_server_ciphers on;

           ssl_ciphers ECDH+AESGCM:ECDH+AES256:ECDH+AES128:DH+3DES:!ADH:!AECDH:!MD5;

           ssl_ecdh_curve secp384r1;
           ssl_session_tickets off;

           resolver 8.8.8.8;

           location / {

                 add_header 'Access-Control-Allow-Origin'  '*' always;
                 add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                     #
                     # Custom headers and headers various browsers *should* be OK with but aren't
                     #
                 add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;             add_header 'Access-Control-Expose-Headers' 'Access-Control-Allow-Origin';
                 add_header    'Access-Control-Allow-Credentials' 'true' always;

                 proxy_pass https://localhost:8443;
                 proxy_set_header Connection "";
                 proxy_set_header Host $host;
                 proxy_set_header X-Real-IP $remote_addr;
                 proxy_set_header X-Forwarded-For $remote_addr;

                 if ($request_method = 'OPTIONS') {

                     #
                     # Tell client that this pre-flight info is valid for 20 days
                     #
                     add_header 'Access-Control-Max-Age' 1728000;
                     add_header 'Content-Type' 'application/json;';
                     #add_header 'Content-Length' 0;
                     return 204;
                 }
                 if ($request_method = 'POST') {
                     add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
                 }
                 if ($request_method = 'GET') {
                     add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
                 }
                 proxy_pass_request_headers      on;
           }
           location /api/ {

               proxy_pass https://localhost:8443;

               proxy_set_header X-Real-IP $remote_addr;
               proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
               proxy_set_header authorization $http_authorization;
               proxy_pass_request_headers      on;
               proxy_no_cache $cookie_nocache  $arg_nocache$arg_comment;
               proxy_no_cache $http_pragma     $http_authorization;
               proxy_cache_bypass $cookie_nocache $arg_nocache $arg_comment;
               proxy_cache_bypass $http_pragma $http_authorization;

                   #
                   # Custom headers and headers various browsers *should* be OK with but aren't
                   #

               if ($request_method = 'OPTIONS') {

                   #
                   # Tell client that this pre-flight info is valid for 20 days
                   #
                   add_header 'Access-Control-Max-Age' 1728000;
                   add_header 'Access-Control-Allow-Origin'  'http://local.web.com:1025' always;
                   add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD' always;
                   add_header 'Access-Control-Allow-Headers' 'authorization, Origin, X-Requested-With, Content-Type, Accept' always;
                   add_header  'Access-Control-Allow-Credentials' 'true' always;
                   return 204;
               }
               if ($request_method = 'POST') {
                   add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
                   add_header 'Access-Control-Allow-Origin'  'http://local.web.com:1025' always;
                   add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD' always;
                   add_header 'Access-Control-Allow-Headers' 'authorization, Origin, X-Requested-With, Content-Type, Accept' always;
                   add_header    'Access-Control-Allow-Credentials' 'true' always;
               }
               if ($request_method = 'GET') {
                   add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
                   add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
                   add_header 'Access-Control-Allow-Origin'  'http://local.web.com:1025' always;
                   add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD' always;
                   add_header 'Access-Control-Allow-Headers' 'authorization, Origin, X-Requested-With, Content-Type, Accept' always;
                   add_header    'Access-Control-Allow-Credentials' 'true' always;

               }

           }

           root   /usr/share/nginx/html;
           index index.html index.htm index.nginx-debian.html;
   }
}
